<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions — Budget Track</title>
  <link rel="stylesheet" href="/css/Transaction.css">
</head>
<body>
  <main>
    <div class="page-heading">
      <h1>Transactions</h1>
      <button class="primary" id="openModal">＋ Nouvelle transaction</button>
    </div>

    <section class="filters" aria-label="Filtres des transactions">
      <div class="field search-wrap"><label for="search">Recherche</label><span>⌕</span><input id="search" type="search" placeholder="Rechercher une transaction..."></div>
      <div class="field"><label for="categoryFilter">Catégorie</label><select id="categoryFilter"><option value="">Toutes les catégories</option><option>Alimentation</option><option>Revenus</option><option>Divertissement</option><option>Transport</option><option>Restauration</option><option>Santé</option><option>Logement</option></select></div>
      <div class="field"><label for="statusFilter">Statut</label><select id="statusFilter"><option value="">Tous les statuts</option><option value="completed">Complété</option><option value="pending">En attente</option><option value="failed">Échoué</option></select></div>
      <div class="field"><label for="periodFilter">Période</label><select id="periodFilter"><option value="all">Toutes les dates</option><option value="30">30 derniers jours</option><option value="90">90 derniers jours</option></select></div>
      <button class="secondary" id="filterButton">☷ Filtrer</button>
      <button class="secondary" id="resetButton">Réinitialiser</button>
    </section>

    <section class="table-card">
      <div class="table-scroll">
        <table>
          <thead><tr><th>Date ↕</th><th>Description</th><th>Catégorie</th><th>Montant</th><th>Statut</th><th>Actions</th></tr></thead>
          <tbody id="transactionRows"></tbody>
        </table>
      </div>
      <div class="table-footer"><div id="resultCount"></div><div class="pagination" id="pagination"></div></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal" id="transactionForm">
      <div class="modal-header"><h2 id="modalTitle">Ajouter une transaction</h2><button type="button" class="close" id="closeModal" aria-label="Fermer">×</button></div>
      <div class="form-grid">
        <div class="full"><label for="newDescription">Description</label><input id="newDescription" required placeholder="Ex. Courses du week-end"></div>
        <div><label for="newDate">Date</label><input id="newDate" type="date" required></div>
        <div><label for="newAmount">Montant (FCFA)</label><input id="newAmount" type="number" step="0.01" required placeholder="-25.00"></div>
        <div><label for="newCategory">Catégorie</label><select id="newCategory"><option>Alimentation</option><option>Revenus</option><option>Divertissement</option><option>Transport</option><option>Restauration</option><option>Santé</option><option>Logement</option></select></div>
        <div><label for="newStatus">Statut</label><select id="newStatus"><option value="completed">Complété</option><option value="pending">En attente</option><option value="failed">Échoué</option></select></div>
      </div>
      <div class="form-actions"><button type="button" class="secondary" id="cancelModal">Annuler</button><button class="primary" type="submit">Ajouter la transaction</button></div>
    </form>
  </div>
<script src="/js/Transaction.js"></script>
</body>
</html>
